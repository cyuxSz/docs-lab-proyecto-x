# Revisa sin LLM que las citas archivo:línea de openwiki/ sigan apuntando al mismo código.
# Si falla, corre /actualizar-docs en Claude Code.
name: wiki-claims

on:
  pull_request:
    paths: ["src/**", "openwiki/**", "README.md", "tools/wiki_claims.py", ".github/workflows/wiki-claims.yml"]
  push:
    branches: [main]
    paths: ["src/**", "openwiki/**", "README.md", "tools/wiki_claims.py", ".github/workflows/wiki-claims.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/wiki_claims.py check
